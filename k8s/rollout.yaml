---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nlp-api-rollout
spec:
  replicas: 5  # Makes 20% canary simpler
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: nlp-api
  template:
    metadata:
      labels:
        app: nlp-api
      annotations:
        # Prometheus auto-scrape /metrics endpoint
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: nlp-api
          image: pettyre1/nlp-api:f33d2f61389e0cf3ac4df18d134def7ab6a07149
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "v1"
  strategy:
    canary:
      steps:
        # 1: 20% of traffic to new version
        - setWeight: 20
        # 2: Run Prometheus Analysis 
        - analysis:
            templates:
              - templateName: latency-check
            args:
              - name: app-name
                value: nlp-api
        # Step 3: If analysis passes, route 100% traffic to new version
        - setWeight: 100
