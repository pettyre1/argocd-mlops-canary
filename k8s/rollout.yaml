---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nlp-api-rollout
spec:
  replicas: 5  # Makes 20% canary simpler
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: nlp-api
  template:
    metadata:
      labels:
        app: nlp-api
      annotations:
        # Prometheus auto-scrape /metrics endpoint
        prometheus.io/scrpe: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: nlp-api
          image: pettyre1/nlp-api:687f02815f8c6ecd9a2dd6dd15f013e8cd85061e
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "v1"  # Change to v2 to sabotage
  strategy:
    canary:
      steps:
        # 1: 20% of traffic to new version
        - setWeight: 20
        # 2: Pause 30s to let traffic hit canary pod
        - pause: { duration: 30s }
        # Step 3: If analysis passes, route 100% traffic to new version
        - setWeight: 100
